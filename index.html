<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rotating Globe</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #f5f0e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #canvas-wrap { width: 100vw; height: 100vh; position: relative; }
  #controls {
    position: absolute; top: 16px; left: 16px;
    background: rgba(255,255,255,0.92);
    border: 2px solid #222;
    border-radius: 8px;
    padding: 14px 16px;
    box-shadow: 4px 4px 0 #222;
    font-size: 13px;
    min-width: 220px;
    z-index: 10;
  }
  #controls h3 { margin: 0 0 10px 0; font-size: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; gap: 10px; }
  .row label { flex: 0 0 70px; color: #444; }
  .row input[type=range] { flex: 1; }
  .row .val { flex: 0 0 36px; text-align: right; font-variant-numeric: tabular-nums; color: #666; font-size: 12px; }
  button {
    width: 100%; margin-top: 6px; padding: 8px;
    background: #222; color: white; border: none; border-radius: 4px;
    cursor: pointer; font-size: 13px; font-weight: 600;
  }
  button:hover { background: #444; }
  .hint { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.4; }
  #canvas-wrap.transparent-preview {
    background: repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 0 0 / 20px 20px;
  }
</style>
</head>
<body>
<div id="canvas-wrap"></div>

<div id="controls">
  <h3>🌍 Globe Controls</h3>
  <div class="row">
    <label>Speed</label>
    <input type="range" id="speed" min="0" max="2" step="0.05" value="0.5">
    <span class="val" id="speedVal">0.5</span>
  </div>
  <div class="row">
    <label>Tilt</label>
    <input type="range" id="tilt" min="-45" max="45" step="1" value="0">
    <span class="val" id="tiltVal">0°</span>
  </div>
  <div class="row">
    <label>Light</label>
    <input type="range" id="light" min="0" max="2" step="0.05" value="1">
    <span class="val" id="lightVal">1.0</span>
  </div>
  <div class="row">
    <label>Zoom</label>
    <input type="range" id="zoom" min="2" max="6" step="0.1" value="5">
    <span class="val" id="zoomVal">5.0</span>
  </div>
  <div style="margin:8px 0 4px;">
    <label style="display:block;font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Map Image</label>
    <label style="display:block;width:100%;box-sizing:border-box;padding:6px 8px;background:#f0f0f0;border:1px dashed #aaa;border-radius:4px;font-size:11px;color:#666;cursor:pointer;text-align:center;">
      <span id="mapFileLabel">Click to load image…</span>
      <input type="file" id="mapFile" accept="image/*" style="display:none;">
    </label>
  </div>
  <div style="display:flex;align-items:center;gap:6px;margin:8px 0 4px;">
    <input type="checkbox" id="dropShadowEnabled">
    <span style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px;">Drop Shadow</span>
  </div>
  <div id="dropShadowControls" style="opacity:0.35;pointer-events:none;">
    <div class="row">
      <label>Color</label>
      <input type="color" id="dropShadowColor" value="#000000" style="flex:1;height:22px;border:1px solid #ccc;border-radius:3px;cursor:pointer;padding:1px;">
      <input type="range" id="dropShadowOpacity" min="0" max="1" step="0.05" value="0.5" style="flex:2;">
      <span class="val" id="dropShadowOpacityVal">0.5</span>
    </div>
    <div class="row">
      <label>Size</label>
      <input type="range" id="dropShadowSize" min="0.3" max="3" step="0.05" value="1.8">
      <span class="val" id="dropShadowSizeVal">1.8</span>
    </div>
    <div class="row">
      <label>Blur</label>
      <input type="range" id="dropShadowBlur" min="0.05" max="1" step="0.05" value="0.5">
      <span class="val" id="dropShadowBlurVal">0.5</span>
    </div>
    <div class="row">
      <label>Distance</label>
      <input type="range" id="dropShadowDist" min="0" max="2" step="0.05" value="0">
      <span class="val" id="dropShadowDistVal">0</span>
    </div>
    <div class="row">
      <label>Angle</label>
      <input type="range" id="dropShadowAngle" min="0" max="360" step="1" value="0">
      <span class="val" id="dropShadowAngleVal">0°</span>
    </div>
  </div>
  <button id="pauseBtn">Pause</button>
  <div class="hint">
    Left drag: spin/tilt · Right drag: axial tilt · Scroll: zoom
  </div>
  <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;flex:1;">
      <input type="checkbox" id="transparentBg"> Transparent
    </label>
    <input type="color" id="bgColor" value="#f5f0e6" title="Background color"
      style="width:32px;height:24px;border:1px solid #ccc;border-radius:3px;cursor:pointer;padding:1px;">
  </div>
  <button id="webmBtn" style="margin-top:8px; background:#0a7;">Export WebM</button>
  <button id="gifBtn" style="margin-top:4px; background:#555;">Export GIF</button>
  <div id="gifStatus" class="hint" style="display:none;"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f0e6);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
wrap.appendChild(renderer.domElement);

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 1.7);
scene.add(ambient);
const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(5, 3, 5);
scene.add(dir);

// Globe
const loader = new THREE.TextureLoader();
const tex = loader.load(MAP_DATA_URL);
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = 8;

const geo = new THREE.SphereGeometry(1, 96, 64);
const mat = new THREE.MeshStandardMaterial({
  map: tex,
  roughness: 0.85,
  metalness: 0.0,
  transparent: true,
  opacity: 1.0,
});
const globe = new THREE.Mesh(geo, mat);
scene.add(globe);

// Group for tilt
const tiltGroup = new THREE.Group();
scene.remove(globe);
tiltGroup.add(globe);
scene.add(tiltGroup);


// Controls state
let speed = 0.5;
let paused = false;
let isExporting = false;
const clock = new THREE.Clock();

// UI hooks
const speedEl = document.getElementById('speed');
const tiltEl = document.getElementById('tilt');
const lightEl = document.getElementById('light');
const zoomEl = document.getElementById('zoom');
const speedVal = document.getElementById('speedVal');
const tiltVal = document.getElementById('tiltVal');
const lightVal = document.getElementById('lightVal');
const zoomVal = document.getElementById('zoomVal');
const pauseBtn = document.getElementById('pauseBtn');

speedEl.addEventListener('input', e => {
  speed = parseFloat(e.target.value);
  speedVal.textContent = speed.toFixed(2);
});
tiltEl.addEventListener('input', e => {
  const t = parseFloat(e.target.value);
  tiltGroup.rotation.z = t * Math.PI / 180;
  tiltVal.textContent = t + '°';
});
// Map image swap
document.getElementById('mapFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const newTex = loader.load(url, () => URL.revokeObjectURL(url));
  newTex.colorSpace = THREE.SRGBColorSpace;
  newTex.anisotropy = 8;
  mat.map = newTex;
  mat.needsUpdate = true;
  document.getElementById('mapFileLabel').textContent = '✓ ' + file.name;
  e.target.value = '';
});

let currentLight = 1.0;
lightEl.addEventListener('input', e => {
  currentLight = parseFloat(e.target.value);
  ambient.intensity = 1.7 * currentLight;
  dir.intensity = 1.2 * currentLight;
  lightVal.textContent = currentLight.toFixed(2);
});

// ---- Drop Shadow ----
const dropShadowMat = new THREE.ShaderMaterial({
  uniforms: {
    uColor:   { value: new THREE.Color(0x000000) },
    uOpacity: { value: 0.0 },
    uBlur:    { value: 0.6 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    uniform float uOpacity;
    uniform float uBlur;
    varying vec2 vUv;
    void main() {
      float d = length(vUv - 0.5) * 2.0;
      float a = (1.0 - smoothstep(0.0, 1.0, pow(d, 1.0 / max(uBlur, 0.01)))) * uOpacity;
      if (a < 0.001) discard;
      gl_FragColor = vec4(uColor, a);
    }
  `,
  transparent: true,
  depthTest: false,
  depthWrite: false,
  side: THREE.DoubleSide,
});
const dropShadowMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), dropShadowMat);
dropShadowMesh.renderOrder = -1;
scene.add(dropShadowMesh);

let dsSizeVal = 1.8, dsDistVal = 0, dsAngleVal = 0;
function updateDropShadow() {
  const rad = dsAngleVal * Math.PI / 180;
  dropShadowMesh.position.set(Math.cos(rad) * dsDistVal, Math.sin(rad) * dsDistVal, -1.5);
  dropShadowMesh.scale.setScalar(dsSizeVal);
}
updateDropShadow();

document.getElementById('dropShadowColor').addEventListener('input', e => {
  dropShadowMat.uniforms.uColor.value.set(e.target.value);
});
document.getElementById('dropShadowOpacity').addEventListener('input', e => {
  const v = parseFloat(e.target.value);
  if (document.getElementById('dropShadowEnabled').checked)
    dropShadowMat.uniforms.uOpacity.value = v;
  document.getElementById('dropShadowOpacityVal').textContent = v.toFixed(2);
});
document.getElementById('dropShadowSize').addEventListener('input', e => {
  dsSizeVal = parseFloat(e.target.value);
  document.getElementById('dropShadowSizeVal').textContent = dsSizeVal.toFixed(2);
  updateDropShadow();
});
document.getElementById('dropShadowBlur').addEventListener('input', e => {
  dropShadowMat.uniforms.uBlur.value = parseFloat(e.target.value);
  document.getElementById('dropShadowBlurVal').textContent = parseFloat(e.target.value).toFixed(2);
});
document.getElementById('dropShadowDist').addEventListener('input', e => {
  dsDistVal = parseFloat(e.target.value);
  document.getElementById('dropShadowDistVal').textContent = dsDistVal.toFixed(2);
  updateDropShadow();
});
document.getElementById('dropShadowAngle').addEventListener('input', e => {
  dsAngleVal = parseFloat(e.target.value);
  document.getElementById('dropShadowAngleVal').textContent = dsAngleVal + '°';
  updateDropShadow();
});
const dropShadowEnabledEl = document.getElementById('dropShadowEnabled');
const dropShadowControlsEl = document.getElementById('dropShadowControls');
dropShadowEnabledEl.addEventListener('change', () => {
  const on = dropShadowEnabledEl.checked;
  dropShadowControlsEl.style.opacity = on ? '1' : '0.35';
  dropShadowControlsEl.style.pointerEvents = on ? 'auto' : 'none';
  dropShadowMat.uniforms.uOpacity.value = on ? parseFloat(document.getElementById('dropShadowOpacity').value) : 0;
});
zoomEl.addEventListener('input', e => {
  const z = parseFloat(e.target.value);
  camera.position.z = z;
  zoomVal.textContent = z.toFixed(1);
});
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? 'Play' : 'Pause';
});

// Initial tilt
tiltGroup.rotation.z = 0;

// Mouse controls
let isDragging = false, isRightDragging = false;
let lastX = 0, lastY = 0;
let manualOffsetY = 0;
let manualOffsetX = 0;

renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

renderer.domElement.addEventListener('mousedown', e => {
  if (e.button === 0) isDragging = true;
  if (e.button === 2) isRightDragging = true;
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mouseup', e => {
  if (e.button === 0) isDragging = false;
  if (e.button === 2) isRightDragging = false;
});
window.addEventListener('mousemove', e => {
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  if (isDragging) {
    manualOffsetY += dx * 0.005;
    manualOffsetX = Math.max(-Math.PI/2, Math.min(Math.PI/2, manualOffsetX + dy * 0.005));
  }
  if (isRightDragging) {
    const newTilt = Math.max(-45, Math.min(45, parseFloat(tiltEl.value) + dx * 0.3));
    tiltEl.value = newTilt;
    tiltGroup.rotation.z = newTilt * Math.PI / 180;
    tiltVal.textContent = Math.round(newTilt) + '°';
  }
  lastX = e.clientX; lastY = e.clientY;
});

// Wheel → zoom, sync slider
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  const z = Math.max(2, Math.min(6, camera.position.z + e.deltaY * 0.01));
  camera.position.z = z;
  zoomEl.value = z;
  zoomVal.textContent = z.toFixed(1);
}, { passive: false });

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Animation loop
function animate() {
  requestAnimationFrame(animate);
  if (isExporting) return;
  const dt = clock.getDelta();
  if (!paused) {
    globe.rotation.y += speed * dt;
  }
  globe.rotation.y += 0; // manual handled below via tiltGroup
  tiltGroup.rotation.x = manualOffsetX;
  // Manual Y offset accumulates into the globe's spin
  if (manualOffsetY !== 0) {
    globe.rotation.y += manualOffsetY;
    manualOffsetY = 0;
  }
  dropShadowMesh.quaternion.copy(camera.quaternion);
  renderer.render(scene, camera);
}
animate();

// ============ WebM Export ============
const webmBtn = document.getElementById('webmBtn');

webmBtn.addEventListener('click', async () => {
  const transparent = transparentBgEl.checked;
  const FPS = 60;
  const safeSpeed = Math.max(speed, 0.01);
  // One full revolution, last frame = one step before start → seamless loop
  const totalFrames = Math.round(2 * Math.PI / safeSpeed * FPS);
  const frameMs = 1000 / FPS;

  const mimeType = transparent && MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9'
    : 'video/webm';

  const stream = renderer.domElement.captureStream(FPS);
  const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 16_000_000 });
  const chunks = [];

  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = transparent ? 'rotating-globe-transparent.webm' : 'rotating-globe.webm';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    webmBtn.disabled = false;
    webmBtn.textContent = 'Export WebM';
    isExporting = false;
    clock.getDelta(); // flush accumulated delta so animation resumes smoothly
  };

  const startRot = globe.rotation.y;
  isExporting = true;
  webmBtn.disabled = true;
  recorder.start();

  for (let i = 0; i < totalFrames; i++) {
    webmBtn.textContent = `Rendering… ${i + 1}/${totalFrames}`;
    globe.rotation.y = startRot + (i / totalFrames) * Math.PI * 2;
    dropShadowMesh.quaternion.copy(camera.quaternion);
    renderer.render(scene, camera);
    await new Promise(r => setTimeout(r, frameMs));
  }

  recorder.stop();
});

// ============ GIF Export ============
const gifBtn = document.getElementById('gifBtn');
const gifStatus = document.getElementById('gifStatus');
const transparentBgEl = document.getElementById('transparentBg');
const bgColorEl = document.getElementById('bgColor');

function applyBackground() {
  const on = transparentBgEl.checked;
  wrap.classList.toggle('transparent-preview', on);
  if (on) {
    scene.background = null;
    renderer.setClearColor(0x000000, 0);
    wrap.style.background = '';
  } else {
    const col = new THREE.Color(bgColorEl.value);
    scene.background = col;
    renderer.setClearColor(col, 1);
    wrap.style.background = bgColorEl.value;
  }
}

transparentBgEl.addEventListener('change', applyBackground);
bgColorEl.addEventListener('input', () => { if (!transparentBgEl.checked) applyBackground(); });

gifBtn.addEventListener('click', async () => {
  gifBtn.disabled = true;
  gifStatus.style.display = 'block';
  gifStatus.textContent = 'Loading encoder...';

  // Load gifenc from CDN (works reliably as an ES module)
  let gifenc;
  try {
    gifenc = await import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/+esm');
  } catch (e) {
    gifStatus.textContent = 'Failed to load encoder. Check internet connection.';
    gifBtn.disabled = false;
    console.error(e);
    return;
  }
  const { GIFEncoder, quantize, applyPalette } = gifenc;

  const FRAMES = 60;
  const SIZE = 400;
  const frameDelay = Math.max(20, Math.round((2 * Math.PI * 1000) / (FRAMES * speed)));
  const transparent = transparentBgEl.checked;

  // Offscreen renderer for export. alpha:true lets us render transparent.
  const exportRenderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    preserveDrawingBuffer: true,
  });
  exportRenderer.setPixelRatio(1);
  exportRenderer.setSize(SIZE, SIZE);
  exportRenderer.setClearColor(0x000000, 0); // transparent clear

  const exportCam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  exportCam.position.copy(camera.position);
  exportCam.lookAt(0, 0, 0);

  // Compositing canvas (where we'll paint each frame)
  const c2d = document.createElement('canvas');
  c2d.width = SIZE;
  c2d.height = SIZE;
  const ctx = c2d.getContext('2d');

  const encoder = GIFEncoder();
  const startRot = globe.rotation.y;
  const sceneBgBackup = scene.background;
  if (transparent) scene.background = null;

  try {
    for (let i = 0; i < FRAMES; i++) {
      gifStatus.textContent = `Capturing frame ${i + 1}/${FRAMES}...`;
      globe.rotation.y = startRot + (i / FRAMES) * Math.PI * 2;
      exportRenderer.render(scene, exportCam);

      // Compose: clear, optionally fill background, then draw the WebGL output
      ctx.clearRect(0, 0, SIZE, SIZE);
      if (!transparent) {
        ctx.fillStyle = bgColorEl.value;
        ctx.fillRect(0, 0, SIZE, SIZE);
      }
      ctx.drawImage(exportRenderer.domElement, 0, 0);

      const imageData = ctx.getImageData(0, 0, SIZE, SIZE);
      const data = imageData.data;

      let palette, indexed;
      if (transparent) {
        // Force fully-transparent pixels to a single sentinel color so the
        // quantizer treats them as one palette entry we can mark transparent.
        // Pick a magenta unlikely to occur in the map.
        const R = 255, G = 0, B = 254;
        for (let p = 0; p < data.length; p += 4) {
          if (data[p + 3] < 128) {
            data[p] = R; data[p + 1] = G; data[p + 2] = B; data[p + 3] = 255;
          } else {
            data[p + 3] = 255;
          }
        }
        palette = quantize(data, 256, { format: 'rgb444' });
        // Find the index of our sentinel color in the palette
        let transparentIndex = 0;
        let bestDist = Infinity;
        for (let k = 0; k < palette.length; k++) {
          const [pr, pg, pb] = palette[k];
          const d = (pr - R) ** 2 + (pg - G) ** 2 + (pb - B) ** 2;
          if (d < bestDist) { bestDist = d; transparentIndex = k; }
        }
        indexed = applyPalette(data, palette, 'rgb444');
        encoder.writeFrame(indexed, SIZE, SIZE, {
          palette,
          delay: frameDelay,
          transparent: true,
          transparentIndex,
          dispose: 2, // restore to background (clears each frame for clean transparency)
        });
      } else {
        palette = quantize(data, 256, { format: 'rgb444' });
        indexed = applyPalette(data, palette, 'rgb444');
        encoder.writeFrame(indexed, SIZE, SIZE, {
          palette,
          delay: frameDelay,
        });
      }

      // Yield to the UI so progress text updates
      await new Promise(r => setTimeout(r, 0));
    }

    gifStatus.textContent = 'Encoding...';
    await new Promise(r => setTimeout(r, 16));

    encoder.finish();
    const buffer = encoder.bytes();
    const blob = new Blob([buffer], { type: 'image/gif' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = transparent ? 'rotating-globe-transparent.gif' : 'rotating-globe.gif';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);

    gifStatus.textContent = 'Done! Check your downloads.';
  } catch (err) {
    console.error(err);
    gifStatus.textContent = 'Export failed: ' + err.message;
  } finally {
    globe.rotation.y = startRot;
    scene.background = sceneBgBackup;
    exportRenderer.dispose();
    gifBtn.disabled = false;
  }
});
</script>
</body>
</html>
